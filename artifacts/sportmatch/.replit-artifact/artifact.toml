kind = "web"
previewPath = "/"
title = "SportMatch"
version = "1.0.0"
id = "artifacts/sportmatch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19554

[services.development]
run = "pnpm --filter @workspace/sportmatch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sportmatch", "run", "build" ]
publicDir = "artifacts/sportmatch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19554"
BASE_PATH = "/"
